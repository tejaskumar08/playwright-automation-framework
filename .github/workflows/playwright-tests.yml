name: Playwright Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-playwright-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps || echo "Playwright browser installation failed. Check dependencies."

      - name: Set Node.js 24 Environment Variable
        run: echo "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true" >> $GITHUB_ENV

      - name: Run TC7_sauceDemo test
        run: |
          npx playwright test src/tests/Web/TC7_sauceDemo.spec.ts || echo "Test case failed. Check logs for details."
          npx playwright show-report

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report || echo "No report found. Ensure tests generate reports."